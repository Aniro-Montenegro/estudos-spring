# Nome da aplicação
spring.application.name=todos

# Exibir comandos SQL no console (corrigido o erro de digitação de 'truefaca')
spring.jpa.show-sql=true

# Formatar o SQL exibido no console para melhor legibilidade
spring.jpa.properties.hibernate.format_sql=true

# Configuração do DDL do Hibernate (auto = update cria/atualiza as tabelas automaticamente com base nas entidades)
spring.jpa.hibernate.ddl-auto=update

# Exemplo de configuração de banco de dados (ajuste para o seu banco: H2, PostgreSQL ou MySQL)
# Usando H2 em memória para testes rápidos:
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true